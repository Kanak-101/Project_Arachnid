# quadbot configuration.
# Values marked UNVERIFIED are starting points: the dashboard's Calibrate tab is
# how you replace them with measured numbers, then "Save config" writes them back here.

driver: pca9685
pca9685:
  stagger: true
  boards:
    left:
      bus: 1                # /dev/i2c-1 on the Pi 5
      address: 80
      freq_hz: 50
      osc_hz: 25000000      # tune if measured pulse widths are consistently off
      stagger: true
    right:
      bus: 1                # /dev/i2c-1 on the Pi 5
      address: 64
      freq_hz: 50
      osc_hz: 25000000
      stagger: true

lidar:
  driver: mock          # mock | rplidar
  port: /dev/ttyUSB0
  baud: 115200          # A1 = 115200, A2 = 256000, C1 = 460800
  clockwise: true       # RPLidar reports angles clockwise; robot frame is counter-clockwise
  mount_offset_deg: 0   # rotate so 0 deg = robot forward (check with your hand)
  mask_deg: []          # [[start, end], ...] arcs to ignore (cables, legs, gimbal)

battery:
  enabled: true
  driver: ads1115       # ads1115 | mock
  bus: 1                # /dev/i2c-1 on the Pi 5
  address: 0x48         # ADS1115 default address (ADDR -> GND)
  channel: 0            # AIN0 (voltage sensor module)
  divider_ratio: 5.0    # 5:1 resistor divider module
  v_min: 6.6            # 2S LiPo cutoff (0%)
  v_max: 8.4            # 2S LiPo full charge (100%)
  v_warn: 7.0           # Low battery warning threshold

control:
  rate_hz: 50
  command_timeout_s: 0.4   # no fresh drive command for this long -> robot stops
  pulse_abs_min: 500       # the dashboard can never command outside this range
  pulse_abs_max: 2500
  sweep_rate_us_s: 200     # gentler speed for automatic sweep test
  jog_rate_us_s: 600       # smoother calibration jog ramping (prevents digital servo jitter)

# All lengths in mm. UNVERIFIED PLACEHOLDERS: measure your legs and edit.
geometry:
  coxa: 45       # hip axis -> femur axis
  femur: 80      # femur axis -> knee/tibia servo axis
  tibia: 131     # tibia servo axis -> foot tip

# hip_xy: hip position in the body frame (x forward, y left), mm. UNVERIFIED.
# side: +1 for left legs, -1 for right legs.
legs:
  FL: {hip_xy: [ 90,  60], side:  1, gamma: 45}
  FR: {hip_xy: [ 90, -60], side: -1, gamma: -45}
  RL: {hip_xy: [-90,  60], side:  1, gamma: 135}
  RR: {hip_xy: [-90, -60], side: -1, gamma: -135}

gait:
  height_stand: 87.0
  height_rest: 46.0
  stance_reach: 123.0
  step_len: 22.0
  stride_scale: 1.3
  step_speed: 1.1
  coxa_gain: 1.5
  step_height: 15.0
  lift_scale: 1.25
  yaw_step_deg: 20.0
  turn_scale: 0.8
  freq_hz: 0.7
  speed_scale: 0.85
  duty_crawl: 0.75
  duty_trot: 0.5

avoid:
  enabled: true
  stop_mm: 350
  slow_mm: 900
  arc_deg: 35
  min_range_mm: 120     # ignore returns closer than this (the robot's own body)
  turn_gain: 0.8
  max_age_s: 0.6        # lidar scan older than this counts as "lidar lost"

# Pulse limits come from Servo_Calibration.xlsx. center / us_per_deg are UNVERIFIED
# midpoint guesses (assumes ~180 deg over the pulse range): calibrate each one.
# board = PCA9685 board name ('left' or 'right').
# channel = PCA9685 output pin (0..15). Edit in the dashboard if wiring differs.
servos:
  # Left PCA board (address 0x50): FL and RL legs
  - {id: FL_coxa,  leg: FL, joint: coxa,  model: MG958,  board: left,  channel: 0, us_min: 500, us_max: 2500, us_center: 1500, us_per_deg: 11.11, invert: false, max_speed_dps: 70}
  - {id: FL_femur, leg: FL, joint: femur, model: MG958, board: left, channel: 1, us_min: 620, us_max: 2380, us_center: 2039.0, us_per_deg: 9.78, invert: false, max_speed_dps: 100, deg_min: -90.0, deg_max: 90.0}
  - {id: FL_tibia, leg: FL, joint: tibia, model: MG958, board: left, channel: 2, us_min: 620, us_max: 2380, us_center: 1421.0, us_per_deg: 9.78, invert: false, max_speed_dps: 100, deg_min: -90.0, deg_max: 90.0}
  - {id: RL_coxa,  leg: RL, joint: coxa,  model: MG958,  board: left,  channel: 3, us_min: 500, us_max: 2500, us_center: 1500, us_per_deg: 11.11, invert: false, max_speed_dps: 70}
  - {id: RL_femur, leg: RL, joint: femur, model: MG995, board: left, channel: 4, us_min: 600, us_max: 2400, us_center: 2210.0, us_per_deg: 10.0, invert: true, max_speed_dps: 100, deg_min: -90.0, deg_max: 90.0}
  - {id: RL_tibia, leg: RL, joint: tibia, model: MG995, board: left, channel: 5, us_min: 600, us_max: 2400, us_center: 1794.0, us_per_deg: 10.0, invert: true, max_speed_dps: 100, deg_min: -90.0, deg_max: 90.0}

  # Right PCA board (address 0x40): FR and RR legs
  - {id: FR_coxa,  leg: FR, joint: coxa,  model: MG958,  board: right, channel: 0, us_min: 500, us_max: 2500, us_center: 1500, us_per_deg: 11.11, invert: false, max_speed_dps: 70}
  - {id: FR_femur, leg: FR, joint: femur, model: MG996R, board: right, channel: 1, us_min: 620, us_max: 2380, us_center: 1814.0, us_per_deg: 9.78, invert: false, max_speed_dps: 100, deg_min: -90.0, deg_max: 90.0}
  - {id: FR_tibia, leg: FR, joint: tibia, model: MG996R, board: right, channel: 2, us_min: 620, us_max: 2380, us_center: 1347.3130565991491, us_per_deg: 9.78, invert: false, max_speed_dps: 100, deg_min: -90.0, deg_max: 90.0}
  - {id: RR_coxa,  leg: RR, joint: coxa,  model: MG958,  board: right, channel: 3, us_min: 500, us_max: 2500, us_center: 1500, us_per_deg: 11.11, invert: false, max_speed_dps: 70}
  - {id: RR_femur, leg: RR, joint: femur, model: MG996R, board: right, channel: 4, us_min: 500, us_max: 2500, us_center: 1977.0, us_per_deg: 11.11, invert: true, max_speed_dps: 100, deg_min: -90.0, deg_max: 90.0}
  - {id: RR_tibia, leg: RR, joint: tibia, model: MG996R, board: right, channel: 5, us_min: 750, us_max: 2250, us_center: 1369.950691356944, us_per_deg: 8.33, invert: true, max_speed_dps: 100, deg_min: -90.0, deg_max: 90.0}
