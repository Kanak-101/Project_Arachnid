# Project Arachnid — Interaction Configuration

camera:
  index: 0
  width: 1280
  height: 720
  fps: 30
  horizontal_fov_deg: 62.0

detection:
  confidence: 0.0
  win_stride: [8, 8]
  padding: [8, 8]
  scale: 1.05

target:
  lost_timeout_s: 2.0
  center_tolerance_px: 80
  iou_threshold: 0.30
  max_track_age_frames: 20

approach:
  preferred_distance_m: 1.5
  minimum_distance_m: 1.3
  maximum_distance_m: 1.7
  horizontal_tolerance_px: 80
  emergency_stop_m: 0.45

motion:
  forward_duration_s: 5.0
  backward_duration_s: 5.0
  turn_left_duration_s: 5.0
  turn_right_duration_s: 5.0
  leg_wave_duration_s: 6.0
  shake_duration_s: 6.0
  dance_duration_s: 8.0

gesture:
  history_frames: 8
  wave_min_range_px: 35.0
  wave_min_direction_changes: 2
  cooldown_s: 2.0

lidar:
  enabled: false
  port: COM3
  baudrate: 115200
  min_range_m: 0.4
  max_range_m: 8.0
  sector_deg: 8.0

transport:
  type: console
  rpi_host: "192.168.0.100"
  rpi_port: 5000
  serial_port: COM4
  serial_baudrate: 115200
